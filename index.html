<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Спасы</title><link rel="stylesheet" href="style.css"></head><body><div class="top"><select id="presets" aria-label="Действие"></select><button id="savePreset" title="Сохранить действие">＋</button><button id="close" title="Закрыть">×</button></div><div id="presetEditor" class="row" hidden><input id="presetName" placeholder="Название" aria-label="Название действия"><button id="confirmPreset">OK</button></div><fieldset disabled id="controls"><div class="fields"><label>Спас<select id="ability"><option value="dex">ЛОВ</option><option value="str">СИЛ</option><option value="con">ТЕЛ</option><option value="int">ИНТ</option><option value="wis">МДР</option><option value="cha">ХАР</option></select></label><label>СЛ<input id="dc" type="number" min="1" max="100" value="17"></label><label>Урон<input id="damage" value="8d6"></label><label>Успех<select id="success"><option value="half">½</option><option value="zero">0</option><option value="full">Полный</option></select></label></div><div class="row"><button id="pick" title="Нажимай токены, чтобы добавить или убрать цель">◎ Цели</button><button id="load" title="Взять стандартное выделение карты">↻</button><span id="count">0</span><select id="visibility" aria-label="Видимость бросков"><option value="self">Dice+ · мне</option><option value="everyone">Dice+ · всем</option></select></div><div id="targets"></div><div id="results"></div><div class="row footer"><button class="primary" id="roll">Бросить</button><button class="primary" id="apply" disabled>Применить</button><button id="undo" disabled title="Отменить урон">↶</button></div></fieldset><div id="status" role="status"></div><script type="module" src="app.js"></script></body></html>
